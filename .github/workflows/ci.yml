name: CI
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v4
     - uses: actions/cache@v4
       with:
         path: ~/.nuget/packages
         key: nuget-${{ hashFiles('**/*.csproj') }}
     - uses: actions/setup-dotnet@v4
       with:
         dotnet-version: 10
     - run: dotnet build
     - run: dotnet test